<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>My Website</title>
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/cubeStyle.css">
	<link rel="icon" href="./favicon.ico" type="image/x-icon">
</head>

<body class="left"> <!-- i made css class for left center and right -->


  <div Id="layer_toggles" class="controls"></div>

  <div class="svg-container">
    <svg class="svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>



  <div class="flex-col">
    <label class="slider">
      Layer gap
      <input type="range" id="gapSlider" min="0" max="80" value="40">
      <output id="gapValue">40</output>
    </label>
    <!-- <div class="controls">
      
    </div>  other buttons? -->
    <div id="ui_side" class="side-options">
					<div class="option_title">Options:</div>
					<form id="option_side">
						<div>
							Disable ALL Popups?
							<select id="skip_all_popup">
								<option>No</option>
								<option>Yes</option>
							</select>
						</div>
					</form>
					<div>
						Restart Game
					</div>
					<div id="reset_buttons"></div>
				</div>
  </div>
</body>
<script type="module" src="./script/gameViewBuilder.js"></script>
<script type="module" src="./script/buildUI.js"></script>
<script type="module" src="./script/buildBoard.js"></script>
<script type="module" src="./script/confirmWindow.js"></script>


</html>
